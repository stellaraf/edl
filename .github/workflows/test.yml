name: test
on: [push, pull_request]

jobs:
    tests:
        name: test
        runs-on: codebuild-stellaraf-actions-public-${{ github.run_id }}-${{ github.run_attempt }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: ">=1.20"
            - run: go test ./...
