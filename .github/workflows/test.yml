name: test
on: [push, pull_request]

jobs:
    tests:
        name: test
        runs-on: codebuild-stellaraf-actions-public-${{ github.run_id }}-${{ github.run_attempt }}
        env:
          GOPATH: ${{ runner.temp }}/go
        steps:
            - uses: actions/checkout@v3
            - uses: actions/setup-go@v4
              with:
                  go-version: ">=1.20"
            - run: go test ./...
